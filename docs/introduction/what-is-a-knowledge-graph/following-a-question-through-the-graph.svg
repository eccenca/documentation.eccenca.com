<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-on" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="26" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f39200"/>
    </marker>
    <marker id="arrow-off" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="26" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0b5ba"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>

  <!-- column headings -->
  <g font-size="13" fill="#80868b" text-anchor="middle">
    <text x="170" y="24">Supplier</text>
    <text x="400" y="24">Plants</text>
    <text x="620" y="24">Products</text>
  </g>

  <!-- not affected: Berger AG supplies Plant Hamburg, which makes Product 10048 -->
  <g stroke="#cfd3d6" stroke-width="2" marker-end="url(#arrow-off)">
    <line x1="400" y1="290" x2="170" y2="290"/>
    <line x1="620" y1="290" x2="400" y2="290"/>
  </g>

  <!-- affected: the path from Kessler GmbH to the products -->
  <g stroke="#f5b14f" stroke-width="2.5" marker-end="url(#arrow-on)">
    <line x1="400" y1="80" x2="170" y2="130"/>
    <line x1="400" y1="190" x2="170" y2="130"/>
    <line x1="620" y1="55" x2="400" y2="80"/>
    <line x1="620" y1="120" x2="400" y2="80"/>
    <line x1="620" y1="190" x2="400" y2="190"/>
  </g>

  <g font-size="13" fill="#f39200" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="285" y="92">is supplied by</text>
    <text x="510" y="56">is made at</text>
  </g>
  <g font-size="13" fill="#9aa0a6" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="285" y="280">is supplied by</text>
    <text x="510" y="280">is made at</text>
  </g>

  <!-- nodes -->
  <circle cx="170" cy="130" r="20" fill="none" stroke="#f39200" stroke-width="2" stroke-dasharray="4 3"/>
  <g fill="#f39200">
    <circle cx="170" cy="130" r="14"/>
    <circle cx="400" cy="80" r="14"/>
    <circle cx="400" cy="190" r="14"/>
    <circle cx="620" cy="55" r="14"/>
    <circle cx="620" cy="120" r="14"/>
    <circle cx="620" cy="190" r="14"/>
  </g>
  <g fill="#b0b5ba">
    <circle cx="170" cy="290" r="14"/>
    <circle cx="400" cy="290" r="14"/>
    <circle cx="620" cy="290" r="14"/>
  </g>

  <!-- node labels -->
  <g font-size="15" font-weight="500" fill="#333333">
    <text x="146" y="135" text-anchor="end">Kessler GmbH</text>
    <text x="400" y="114" text-anchor="middle">Plant Leipzig</text>
    <text x="400" y="224" text-anchor="middle">Plant Dresden</text>
    <text x="642" y="60">Product 10045</text>
    <text x="642" y="125">Product 10046</text>
    <text x="642" y="195">Product 10047</text>
  </g>
  <g font-size="15" font-weight="500" fill="#9aa0a6">
    <text x="146" y="295" text-anchor="end">Berger AG</text>
    <text x="400" y="324" text-anchor="middle">Plant Hamburg</text>
    <text x="642" y="295">Product 10048</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#5f6368">
    <circle cx="30" cy="345" r="6" fill="#f39200"/>
    <text x="42" y="349">affected by the supplier failure</text>
    <circle cx="250" cy="345" r="6" fill="#b0b5ba"/>
    <text x="262" y="349">not affected</text>
  </g>
</svg>
