<section id="what" data-explainer="what-is-an-ontology" data-markdown>
<textarea data-template>
## Ontologies are shared, structured conceptualizations

- **Conceptualization** – a simplified view of a domain for a purpose: the things, concepts and their relations
- **Structured** – written in standard languages such as RDFS, OWL and SKOS
- **Shared** – agreed by domain experts, an extensible standard for the domain's data

Domains range from the basic – persons, places, activities – to specialist areas such as supply chains or manufacturing.
</textarea>
</section>

<section id="methodology" data-explainer="methodology" data-markdown>
<textarea data-template>
## There is no single right ontology

- The domain and the application decide
- Concepts stay close to the objects and relations of the domain
- **Nouns** in sentences about the domain become classes, **verbs** become properties
- The intended use decides which of them are needed

**Iterate:** model, discuss, apply, refine.
</textarea>
</section>

<section id="scope" data-explainer="scope-and-requirements" data-markdown>
<textarea data-template>
## Scope and requirements

- Is there data already – or is this a green field?
- What is the data used for?
- A clearer, logical model of the domain – or compatibility with legacy structures?
- How much metadata is needed?
- Which other data sources are relevant?
- Do ontologies for the domain already exist?
</textarea>
</section>

<section id="competency-questions" data-explainer="competency-questions" data-markdown>
<textarea data-template>
## Competency questions

1. Write down the questions the ontology has to answer
2. After each milestone:

   - query or browse it to answer the questions

<span class="ask">Which products does a department manage?</span>
<span class="ask">Who can take over a product when its manager leaves?</span>

<section id="domain" data-explainer="the-domain" data-markdown>
<textarea data-template>
## The domain: product data

<div class="domain-text">

The company's physical products and services are managed by product managers.
Product management is distributed across all departments in which they have a direct report.
Products are structured into categories, for which product managers and responsible departments have expertise.

For example, product P516-8211068, named Film Multiplexer Rheostat Warp, is managed by Kristen Bauers in Procurement.

</div>
</textarea>
</section>

<section id="concepts" data-explainer="concepts-relationships-instances-and-attributes" data-markdown>
<textarea data-template>
## Concepts, relations, instances, attributes

<div class="domain-text">

The company's physical <span class="c-concept">products</span> and <span class="c-concept">services</span> are <span class="c-rel">managed by</span> <span class="c-concept">product managers</span>.
Product management is distributed across all <span class="c-concept">departments</span> in which they <span class="c-rel">have</span> a <span class="c-concept">direct report</span>.
Products are <span class="c-rel">structured into</span> <span class="c-concept">categories</span>, for which product managers and <span class="c-rel">responsible</span> departments <span class="c-rel">have expertise</span>.

For example, product <span class="c-inst">P516-8211068</span>, <span class="c-attr">named</span> <span class="c-inst">Film Multiplexer Rheostat Warp</span>, is managed by <span class="c-inst">Kristen Bauers</span> in <span class="c-inst">Procurement</span>.

</div>

<p class="small"><span class="c-concept">concepts</span> · <span class="c-rel">relationships</span> · <span class="c-inst">instances</span> – usually from data sources · <span class="c-attr">attributes</span></p>
</textarea>
</section>

<section id="approaches" data-explainer="defining-classes" data-markdown>
<textarea data-template>
## Defining classes

- **Top-down** – most general classes first, then specialize
- **Bottom-up** – most specific classes first, then generalize
- **Middle-out** – the most salient classes first, then both directions

Candidates: <span class="c-concept">product, service, product manager, department, direct report, category</span>

Draw it: classes as boxes, relations as arrows.
</textarea>
</section>

<section id="class-or-attribute" data-explainer="class-or-attribute" data-markdown>
<textarea data-template>
## Class or attribute?

| facility | city | cityLocation |
| --- | --- | --- |
| manu1 | Amadora | 38.7578° N, 9.2245° W |
| manu2 | Bangkok | 13.7563° N, 100.5018° E |
| store3 | Seattle | 47.6062° N, 122.3321° W |

- `facility —cityName→ "Amadora"` – fine while the city is only a name
- `facility —locatedIn→ City` – needed once the city has statements of its own

A thing becomes a class when it is a **business object**, carries **statements of its own**, or appears in **other datasets**.
</textarea>
</section>

<section id="formalize" data-explainer="formalize" data-markdown>
<textarea data-template>
## Formalize

```turtle
prod:Employee a owl:Class ;
    rdfs:subClassOf prod:Agent ;
    rdfs:label "Employee"@en ;
    rdfs:isDefinedBy <http://ld.company.org/prod-vocab/> .

prod:hasProductManager a owl:ObjectProperty ;
    rdfs:domain prod:Product ;
    rdfs:range  prod:Employee ;
    rdfs:label "has product manager"@en ;
    rdfs:isDefinedBy <http://ld.company.org/prod-vocab/> .
```

Tools: a text editor, Protégé, or the **Business Knowledge Editor** in Corporate Memory.
</textarea>
</section>

<section id="quality" data-explainer="quality-checks" data-markdown>
<textarea data-template>
## Quality checks

**The ontology**
- header: version, preferred prefix and namespace
- every class and property: `rdf:type`, `rdfs:isDefinedBy`
- at least one `rdfs:label` and `rdfs:comment` – no "todo"
- labels and comments unique and different from each other

**The data**
- SHACL shapes check instance data against the model
- automated in workflows and CI pipelines
</textarea>
</section>

<section id="visualize" data-explainer="visualize-and-use" data-markdown>
<textarea data-template>
## Visualize and use the ontology

- A diagram shows the structure, helps domain experts follow it, and reveals errors
- In Corporate Memory:
  - **Vocabulary Catalog** – install and manage vocabularies
  - **Business Knowledge Editor** – explore and author ontologies visually
  - **Mapping editor** – fill the ontology with data from sources

*Data is what brings an ontology to life.*
</textarea>
</section>
