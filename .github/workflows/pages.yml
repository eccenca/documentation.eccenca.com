---
# Simple workflow for deploying static content to GitHub Pages
name: Deploy Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: "0"

      - name: setup github pages
        uses: actions/configure-pages@v5

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: install task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install and configure poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: load environment cache
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: update packages
        run: sudo apt-get update -y

      - name: install packages
        run: sudo apt-get install -y libffi-dev libz-dev

      - name: install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_ASSET: lychee-x86_64-unknown-linux-gnu
          LYCHEE_RELEASES: https://github.com/lycheeverse/lychee/releases/download
        run: |
          curl -sSfL "${LYCHEE_RELEASES}/lychee-v${LYCHEE_VERSION}/${LYCHEE_ASSET}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${LYCHEE_ASSET}/lychee"
          lychee --version

      - name: load link check cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          # A new key per run saves the updated cache; restore-keys picks up the latest one.
          # lychee itself re-checks entries older than max_cache_age (lychee.toml).
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task check

      - name: build
        run: task clean build

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'site'

      - name: deploy to gitHub pages
        id: deployment
        uses: actions/deploy-pages@v4

