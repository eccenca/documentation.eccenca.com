---
name: PDF

# Builds every PDF of the documentation after a push to main or to the
# print-on-demand branch: the screen edition, the print edition (the book block
# for print on demand), its PDF/X-4 copy in CMYK and the greyscale preview. The
# run summary lists all four with their download links, so they need not be dug
# out of the artifact section.
on:
  push:
    branches: ["main", "feature/print-on-demand"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes a running build obsolete; main and a
# branch do not cancel each other.
concurrency:
  group: "pdf-${{ github.ref }}"
  cancel-in-progress: true

env:
  # The versions the PDF style is tested with (TESTED_TYPST in tools/build_pdf.py).
  # Typst is pre-1.0 and its minor releases change layout, and the pandoc Ubuntu
  # ships is older, so both come from their own releases.
  PANDOC_VERSION: "3.11"
  TYPST_VERSION: "0.15.1"

jobs:

  pdf:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: "0"

      - name: setup python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: install task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install and configure poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: load environment cache
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: update packages
        run: sudo apt-get update -y

      # Ghostscript converts the book block to PDF/X-4 and to greyscale; poppler
      # carries the pdffonts, pdfimages and pdftotext the preflight report reads.
      - name: install packages
        run: sudo apt-get install -y libffi-dev libz-dev ghostscript poppler-utils

      - name: install pandoc
        run: |
          release="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/pandoc.deb" \
            "${release}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"

      - name: install typst
        run: |
          release="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}"
          curl --fail --silent --show-error --location "${release}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst

      # The ISO Coated v2 profile of the output intent is not in the repository
      # (its licence forbids it), so it is fetched once and kept between runs.
      - name: cache the output intent profile
        uses: actions/cache@v4
        with:
          path: dist/icc
          key: icc-iso-coated-v2-eci

      # Where a distribution puts Ghostscript's own grey profile differs, so the
      # greyscale pass is told which file to use instead of guessing.
      - name: find the grey profile
        run: |
          profile="$(find /usr/share /usr/lib -name default_gray.icc -print -quit 2>/dev/null || true)"
          if [ -z "$profile" ]; then
            echo "no default_gray.icc found - install it or drop --gray" >&2
            exit 1
          fi
          echo "PDF_GRAY_PROFILE=$profile" >> "$GITHUB_ENV"

      - name: build the screen pdf
        run: task pdf

      - name: build the print pdfs
        run: task pdf:print -- --normalize --gray

      - name: upload the screen pdf
        id: screen
        uses: actions/upload-artifact@v4
        with:
          name: pdf-screen
          path: |
            dist/documentation-eccenca-com-*.pdf
            !dist/documentation-eccenca-com-*-print*.pdf
          if-no-files-found: error
          retention-days: 30
          # A PDF is compressed already.
          compression-level: 0

      - name: upload the print pdf
        id: print
        uses: actions/upload-artifact@v4
        with:
          name: pdf-print
          path: dist/documentation-eccenca-com-*-print.pdf
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: upload the pdf/x-4 pdf
        id: pdfx
        uses: actions/upload-artifact@v4
        with:
          name: pdf-print-x4
          path: dist/documentation-eccenca-com-*-print-x4.pdf
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: upload the greyscale pdf
        id: gray
        uses: actions/upload-artifact@v4
        with:
          name: pdf-print-gray-x4
          path: dist/documentation-eccenca-com-*-print-gray-x4.pdf
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: list the pdfs in the run summary
        run: |
          row() {
            file="$1"
            edition="$2"
            url="$3"
            pages="$(pdfinfo "$file" | awk '/^Pages/ {print $2}')"
            size="$(du -h "$file" | cut -f1)"
            printf '| %s | %s | %s | [%s](%s) |\n' \
              "$edition" "$pages" "$size" "$(basename "$file")" "$url" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "## PDF editions of ${GITHUB_REF_NAME}"
            echo
            echo "| Edition | Pages | Size | Download |"
            echo "| :------ | ----: | ---: | :------- |"
          } >> "$GITHUB_STEP_SUMMARY"
          row "$(ls dist/documentation-eccenca-com-*.pdf | grep -v -- '-print' | head -1)" \
            "Screen" "${{ steps.screen.outputs.artifact-url }}"
          row "$(ls dist/documentation-eccenca-com-*-print.pdf | head -1)" \
            "Print, book block" "${{ steps.print.outputs.artifact-url }}"
          row "$(ls dist/documentation-eccenca-com-*-print-x4.pdf | head -1)" \
            "Print, PDF/X-4 in CMYK" "${{ steps.pdfx.outputs.artifact-url }}"
          row "$(ls dist/documentation-eccenca-com-*-print-gray-x4.pdf | head -1)" \
            "Print, greyscale preview" "${{ steps.gray.outputs.artifact-url }}"
          {
            echo
            echo "The print editions carry the preflight report of \`dec-tool pdf-preflight\`;"
            echo "a failed check fails this job."
          } >> "$GITHUB_STEP_SUMMARY"
