[tool.poetry]
name = "documentation-eccenca-com"
version = "0.0.0"
description = "Documentation repository for eccenca Corporate Memory"
authors = ["Sebastian Tramp <sebastian.tramp@eccenca.com>"]
homepage = "https://github.com/eccenca/documentation.eccenca.com"
readme = "README.md"
packages = [{include = "tools"}]

[tool.poetry.urls]
"Issue Tracker" = "https://github.com/eccenca/documentation.eccenca.com/issues"

[tool.poetry.scripts]
dec-tool = 'tools:cli'

[tool.poetry.dependencies]
python = "^3.11"
mike = "^2.1.3"
# Public Material for MkDocs (no longer the private Insiders fork). Zensical does
# NOT depend on it, but mkdocs.yml resolves `!!python/name:material.*` handles for
# the twemoji index and the tags plugin, so the package must stay installed.
mkdocs-material = "^9.7.6"
cmem-cmempy = "^25.3.0"
pydantic = "^2.11.7"
jinja2 = "^3.1.6"
# Zensical is pre-1.0: the caret pin resolves to >=0.0.58,<0.0.59, i.e. a single
# release. This narrowness is intentional -- bump it manually and re-run
# `task build` plus `tools/check_zensical_output.py` when doing so.
zensical = "^0.0.58"

[tool.poetry.group.dev.dependencies]
linkcheckmd = "^1.4.0"
rumdl = "^0.0.194"
pytest = "^9.1.1"

[tool.pytest.ini_options]
markers = [
    "integration: needs a live DI/CMEM instance to run",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
