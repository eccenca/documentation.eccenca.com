[tool.poetry]
name = "documentation-eccenca-com"
version = "0.0.0"
description = "Documentation repository for eccenca Corporate Memory"
authors = ["Sebastian Tramp <sebastian.tramp@eccenca.com>"]
homepage = "https://github.com/eccenca/documentation.eccenca.com"
readme = "README.md"
packages = [{include = "tools"}]

[tool.poetry.urls]
"Issue Tracker" = "https://github.com/eccenca/documentation.eccenca.com/issues"

[tool.poetry.scripts]
dec-tool = 'tools:cli'

[tool.poetry.dependencies]
python = "^3.11"
# Squidfunk's mike fork, the only mike that works under Zensical: released mike
# validates mkdocs.yml with the MkDocs config loader (which aborts here on the
# uninstalled awesome-pages plugin) and shells out to `mkdocs`/`properdocs build`.
# The fork swaps that layer for `zensical.config` plus `zensical build`. Upstream
# calls it transitional, until Zensical ships native versioning:
# https://zensical.org/docs/compatibility/mkdocs/mike/
# Pinned to a revision, not the 2.2.0+zensical-0.1.0 tag: two later commits fix
# missing config defaults (`canonical_version`), and this is the revision that
# `task public:deploy` was verified against.
mike = { git = "https://github.com/squidfunk/mike.git", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" }
# Public Material for MkDocs (no longer the private Insiders fork). Zensical does
# NOT depend on it, but mkdocs.yml resolves `!!python/name:material.*` handles for
# the twemoji index and the tags plugin, so the package must stay installed.
mkdocs-material = "^9.7.6"
cmem-cmempy = "^25.3.0"
pydantic = "^2.11.7"
jinja2 = "^3.1.6"
# Zensical is pre-1.0: the caret pin resolves to >=0.0.59,<0.0.60, i.e. a single
# release. This narrowness is intentional -- bump it manually and re-run
# `task build` plus `tools/check_zensical_output.py` when doing so.
zensical = "^0.0.59"

[tool.poetry.group.dev.dependencies]
linkcheckmd = "^1.4.0"
rumdl = "^0.0.194"
pytest = "^9.1.1"
yamllint = "^1.38.0"

[tool.pytest.ini_options]
markers = [
    "integration: needs a live DI/CMEM instance to run",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
